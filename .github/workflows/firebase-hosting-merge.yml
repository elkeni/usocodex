name: Deploy production to Firebase Hosting
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPMUSICA_5C872 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: https://music-backend-tau.vercel.app
          VITE_SPOTIFY_CLIENT_ID: 7de90d09b8a240e8bcb4ab468e68b24d
      - name: Deploy
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: appmusica-5c872
      - name: Deployment credential notice
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: echo "::warning::Build validado. Añade FIREBASE_SERVICE_ACCOUNT_APPMUSICA_5C872 para habilitar el despliegue automático."
