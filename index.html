<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="ParadisQuo - Tu reproductor de música personal con streaming de alta calidad" />
    <meta name="application-name" content="ParadisQuo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ParadisQuo" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/iconapp.png" />
    <link rel="apple-touch-icon" href="/iconapp.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ParadisQuo</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #000; color: #fff; }
      .app-loading { min-height: 100vh; display: grid; place-items: center; }
      .app-loading-spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,.12); border-top-color: #e91e63; border-radius: 50%; animation: app-spin .8s linear infinite; }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" aria-label="Cargando ParadisQuo">
        <div class="app-loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
